name: Build and Release Windows App

# This tells GitHub to only run this script when you push a tag that starts with "v" (e.g., v1.0.1)
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # Grants permission to create a GitHub Release

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Change to your preferred Python version

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Flet Executable
        run: flet pack main.py --name "Gerador_Redmine" --icon "icon.ico"

      - name: Compile Inno Setup Installer
        # Windows runners on GitHub Actions come with Inno Setup (iscc) pre-installed!
        run: iscc setup.iss

      - name: Create GitHub Release and Upload Installer
        uses: softprops/action-gh-release@v2
        with:
          # Automatically uses your tag name (e.g., v1.0.1) as the release name
          name: Release ${{ github.ref_name }}
          # Points to the installer generated by Inno Setup
          files: Output/*.exe
          generate_release_notes: true